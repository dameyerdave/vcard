services:
  enbizcard:
    build: .
    container_name: enbizcard
    env_file:
      - .env
    expose:
      - "80"
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  envoy:
    image: ${ENVOY_IMAGE}
    container_name: enbizcard-envoy
    depends_on:
      - enbizcard
    ports:
      - "${ENVOY_PORT}:80"
    restart: unless-stopped
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    container_name: enbizcard-cloudflared
    depends_on:
      - envoy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
